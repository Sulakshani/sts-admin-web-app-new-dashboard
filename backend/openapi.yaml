openapi: 3.0.3
info:
  title: STS Admin Backend API
  version: 1.0.0
  description: OpenAPI specification for the STS admin backend.
servers:
  - url: /
paths:
  /:
    get:
      summary: API Root
      responses:
        "200":
          description: Welcome message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: STS Admin Backend API is running
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/admin/auth/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login succeeded
        "401":
          description: Invalid credentials
  /api/admin/auth/logout:
    post:
      summary: Admin logout
      responses:
        "200":
          description: Logged out
  /api/admin/auth/refresh:
    post:
      summary: Refresh access token
      responses:
        "200":
          description: Token refreshed
  /api/admin/auth/profile:
    get:
      summary: Get admin profile
      responses:
        "200":
          description: Profile returned
  /api/admin/auth/bootstrap-status:
    get:
      summary: Get bootstrap status
      responses:
        "200":
          description: Bootstrap status returned
  /api/admin/auth/forgot-password:
    post:
      summary: Request password reset
      responses:
        "200":
          description: Reset requested
  /api/admin/auth/verify-reset-token:
    post:
      summary: Verify reset token
      responses:
        "200":
          description: Token verified
  /api/admin/auth/reset-password:
    post:
      summary: Reset password
      responses:
        "200":
          description: Password reset
  /api/complaints:
    get:
      summary: List complaints
      responses:
        "200":
          description: Complaints returned
  /api/complaints/{id}:
    get:
      summary: Get complaint by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complaint returned
  /api/escalation/stats:
    get:
      summary: Get escalation stats
      responses:
        "200":
          description: Stats returned
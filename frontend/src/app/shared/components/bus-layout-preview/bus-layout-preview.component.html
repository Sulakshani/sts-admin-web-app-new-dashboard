<div class="bus-preview-container">
  <div class="bus-header">
    <div class="bus-front">
      <svg width="100" height="80" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="10" width="90" height="60" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
        <circle cx="30" cy="40" r="8" fill="#ffffff" opacity="0.3"/>
        <circle cx="70" cy="40" r="8" fill="#ffffff" opacity="0.3"/>
        <text x="50" y="45" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">FRONT</text>
      </svg>
    </div>
  </div>

  <div class="bus-layout">
    <div class="row-container" *ngFor="let row of layoutPreview?.rows">
      <div class="row-label">{{ row.row_label }}</div>

      <div class="seats-row">
        <!-- Left side seats -->
        <div class="seat-group left-side">
          <div
            *ngFor="let seat of row.left_seats"
            class="seat"
            [class.window-seat]="seat.is_window_seat"
            [class.aisle-seat]="seat.is_aisle_seat">
            <span class="seat-number">{{ seat.seat_number }}</span>
          </div>
        </div>

        <!-- Aisle -->
        <div class="aisle-space">
          <div class="aisle-line"></div>
        </div>

        <!-- Right side seats -->
        <div class="seat-group right-side">
          <div
            *ngFor="let seat of row.right_seats"
            class="seat"
            [class.window-seat]="seat.is_window_seat"
            [class.aisle-seat]="seat.is_aisle_seat">
            <span class="seat-number">{{ seat.seat_number }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bus-footer">
    <div class="bus-back">
      <svg width="100" height="40" viewBox="0 0 100 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="5" width="90" height="30" rx="5" fill="#64748b"/>
        <text x="50" y="25" text-anchor="middle" fill="#ffffff" font-size="10">BACK</text>
      </svg>
    </div>
  </div>

  <div class="seat-legend">
    <div class="legend-item">
      <div class="seat-sample window-seat">
        <span>A1W</span>
      </div>
      <span>Window Seat</span>
    </div>
    <div class="legend-item">
      <div class="seat-sample aisle-seat">
        <span>A2</span>
      </div>
      <span>Aisle Seat</span>
    </div>
    <div class="legend-item">
      <div class="seat-sample">
        <span>A3</span>
      </div>
      <span>Regular Seat</span>
    </div>
  </div>
</div>
